name: Deploy to Appwrite Cloud
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        env:
          EXPO_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.EXPO_PUBLIC_APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
          EXPO_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_APPWRITE_PROJECT_ID || '6a3b7680002e8d01dd74' }}
          EXPO_PUBLIC_APPWRITE_PLATFORM: ${{ secrets.EXPO_PUBLIC_APPWRITE_PLATFORM || 'in.localy.app' }}
        run: npm install --legacy-peer-deps
      - name: Build Expo web
        working-directory: frontend
        env:
          EXPO_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.EXPO_PUBLIC_APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
          EXPO_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_APPWRITE_PROJECT_ID || '6a3b7680002e8d01dd74' }}
          EXPO_PUBLIC_APPWRITE_PLATFORM: ${{ secrets.EXPO_PUBLIC_APPWRITE_PLATFORM || 'in.localy.app' }}
        run: npx expo export --platform web
      - name: Patch bundle
        working-directory: frontend
        run: node scripts/patch-dist.js
      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli
      - name: Configure Appwrite CLI
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client --endpoint "https://sgp.cloud.appwrite.io/v1" --project-id "6a3b7680002e8d01dd74" --key "$APPWRITE_API_KEY"
      - name: Deploy to Appwrite Hosting
        working-directory: frontend
        run: appwrite sites create-deployment --site-id "6a40cb0f001a61549ba1" --code "./dist" --activate true --install-command "true" --build-command "true" --output-directory "."
